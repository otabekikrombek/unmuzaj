# Проверки каждого PR и main: уязвимости зависимостей, типы, строки интерфейса, сборка,
# бюджет веса (size-limit) и Lighthouse (6 страниц, телефон). Пороги — «Правила Allimni 2.0» в CLAUDE.md.
# Отдельное задание sql гоняет SQL-тесты (supabase/tests) на PostgreSQL 17 в контейнере: без секретов и без настоящей базы Supabase.
# Сайт эта задача не публикует — публикация в deploy.yml, которая вызывает эти проверки и выкладывает сайт только после их успеха.
name: Проверки

on:
  pull_request:
  workflow_call: # на main проверки запускает deploy.yml перед публикацией (отдельного запуска по push нет)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # закреплено: ubuntu-26.04 (D36); не ubuntu-latest, чтобы образ менялся только нашим решением
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: ВРЕМЕННО (диагностика) — версии на образе
        shell: bash {0}
        run: |
          cat /etc/os-release | head -3
          echo "Node образа: $(node -v 2>&1)"; npm -v 2>&1
          psql --version 2>&1
          google-chrome --version 2>&1
          docker --version 2>&1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: ВРЕМЕННО (диагностика) — Node после setup-node
        shell: bash {0}
        run: |
          echo "Node: $(node -v)  npm: $(npm -v)"
      - name: Уязвимости зависимостей (npm audit)
        # то, что попадает на сайт: high и critical — ошибка; инструменты сборки и тестов: только critical
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Типы (astro check)
        run: npm run check

      - name: Строки интерфейса (ru / uz / en)
        run: npm run test:i18n

      - name: Пробный экзамен — выборка, перемешивание, время (tests/mock.mjs)
        run: npm run test:mock

      - name: Сборка
        run: npm run build

      - name: Заголовки безопасности для Cloudflare Pages созданы
        run: test -s dist/_headers && grep -q 'Content-Security-Policy' dist/_headers

      - name: Бюджет веса (size-limit)
        run: npx size-limit

      - name: Lighthouse (телефон, 6 страниц)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: ВРЕМЕННО (диагностика) — медианные значения Lighthouse
        if: always()
        shell: bash {0}
        run: |
          node -e '
          const fs=require("fs");const d=".lighthouseci/reports/";
          const m=JSON.parse(fs.readFileSync(d+"manifest.json","utf8")).filter(x=>x.isRepresentativeRun);
          for(const x of m){const r=JSON.parse(fs.readFileSync(d+x.jsonPath.split("/").pop(),"utf8"));const a=r.audits;
          console.log("LH",x.url.replace(/^http:\/\/localhost:\d+/,""),"perf",r.categories.performance.score,"a11y",r.categories.accessibility.score,"bp",r.categories["best-practices"].score,"seo",r.categories.seo.score,"LCP",Math.round(a["largest-contentful-paint"].numericValue),"CLS",a["cumulative-layout-shift"].numericValue.toFixed(3),"TBT",Math.round(a["total-blocking-time"].numericValue),"UA",r.environment.hostUserAgent);}
          ' || true

      - name: Отчёты Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

  sql:
    name: SQL-тесты (PostgreSQL 17)
    # закреплено: ubuntu-26.04 (D36); не ubuntu-latest, чтобы образ менялся только нашим решением
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres # пароль одноразового контейнера, не секрет
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: ВРЕМЕННО (диагностика) — версии на образе
        shell: bash {0}
        run: |
          psql --version 2>&1
          pg_isready --version 2>&1

      - name: База t1, имитация Supabase и два пользователя (tests/README.md)
        run: |
          createdb t1
          psql -d t1 -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stub.sql
          psql -d t1 -v ON_ERROR_STOP=1 -c "insert into auth.users(email, created_at) values ('teacher@x', now() - interval '1 day'), ('other@x', now())"

      - name: Миграции supabase/migrations/*.sql по порядку имён
        run: |
          files=(supabase/migrations/*.sql)
          test -e "${files[0]}" || { echo "Миграции не найдены"; exit 1; }
          for f in "${files[@]}"; do
            echo "== $f"
            psql -d t1 -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Тесты базы (ошибка SQL или нет маркера «passed» — задание красное)
        run: |
          set -euo pipefail
          for t in "10_test:core tests passed" "20_quiz_test:quiz tests passed" "30_mock_test:mock tests passed" "40_hardening_test:hardening tests passed"; do
            file="supabase/tests/${t%%:*}.sql"
            marker="${t#*:}"
            echo "== $file"
            psql -d t1 -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee "/tmp/${t%%:*}.log"
            grep -q "$marker" "/tmp/${t%%:*}.log" || { echo "::error::В выводе $file нет «$marker»"; exit 1; }
          done
