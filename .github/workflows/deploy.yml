name: Публикация сайта на GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Те же проверки, что на PR (задания checks и sql из checks.yml). Не прошли — build и deploy не стартуют, сайт остаётся прежним.
  gate:
    name: Проверки
    uses: ./.github/workflows/checks.yml

  build:
    name: Сборка
    needs: gate
    # закреплено: ubuntu-26.04 (D36); не ubuntu-latest, чтобы образ менялся только нашим решением
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    name: Публикация
    needs: build
    # запуск вручную с другой ветки проходит проверки и сборку, но не публикует
    if: github.ref == 'refs/heads/main'
    # закреплено: ubuntu-26.04 (D36); не ubuntu-latest, чтобы образ менялся только нашим решением
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
